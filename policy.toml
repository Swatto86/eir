[execution]
# Fallback confidence threshold. The LIVE value is set in the app's Settings
# panel (config.toml's monitoring.confidence_threshold) and overrides this at
# startup. Whitelisted, reversible actions auto-execute at or above the threshold;
# below it they are blocked. The catastrophic actions (bcd_edit, driver_disable,
# powershell_diagnostic) are kept off the whitelist on purpose, so they require
# approval regardless of confidence.
confidence_threshold = 0.80
max_retries_per_issue = 3
rate_limit_mins = 30
auto_approve_on_success_rate = 0.95

[whitelist]
actions = [
    "service_restart",
    "service_stop",
    "service_start",
    "log_cleanup",
    "disk_cleanup",
    "task_disable",
    "task_enable",
    "network_diagnostic",
    # Phase 4 — lower-risk actions auto-approved
    "driver_enable",
    # Phase 5 — security self-healing (safe, reversible: restores a protective default)
    "firewall_enable",
    "defender_signature_update",
    # Always require approval (disruptive, irreversible, or user-sensitive — never auto-run):
    # registry_reset (a registry write can plant boot persistence / shell hijacks that no
    # static allowlist can fully enumerate, so a human sees every one — the executor still
    # applies a component-boundary allow/deny gate and now snapshots the prior value for undo),
    # file_delete (deletes a file, e.g. an app's config), process_kill (can close a
    # foreground app/game), powershell_diagnostic, driver_disable,
    # software_uninstall (also hard-blocked), bcd_edit, sfc_scan, dism_restore_health,
    # defender_realtime_enable (reversible but could conflict with a user's AV choice)
]

[blocklist]
# Action types that are never executed — not even with approval.
actions = [
    "software_uninstall",   # one-way door: Eir has no reinstall path, so never remove apps
]

services = [
    "NTDS",
    "KDC",
    "DFSR",
    "NetLogon",
    "Hyper-V",
    "vmms",
    "WdNisDrv",
    "WinDefend",
    "MsMpSvc",
    "WSB",      # Windows Server Backup
    "vss",      # Volume Shadow Copy
]

paths = [
    "C:\\Windows\\System32",
    "C:\\Windows\\SysWOW64",
    "C:\\Windows\\WinSxS",
    "C:\\Windows\\Boot",
    "C:\\Windows\\Fonts",
    # Registry persistence / hijack locations. These entries make the policy layer's
    # registry_reset gate real (it normalises hive aliases, so HKLM:/HKEY_* both match)
    # and give the user a clear "on the blocklist" reason. The executor's own
    # registry allow/deny list is the hard backstop even if these are edited out.
    "HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run",
    "HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce",
    "HKCU:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon",
]
