name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --target x86_64-pc-windows-msvc

  verify:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The release version lives in five manifests and four Cargo.lock entries.
      - name: Check version sync
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-versions.ps1

      - name: Check installer hooks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer-hooks.ps1

      - name: Check release gates
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-gates.ps1

      - name: Check portable runner
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-portable-runner.ps1

      # Pinned to match rust-toolchain.toml (and local dev) so a stable bump can't
      # introduce new clippy/rustfmt behaviour that diverges from local verify.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check frontend JavaScript
        run: node --check ui/main.js

      # eir-ui's tauri_build validates the bundle resources (incl. bin/eir-svc.exe,
      # a gitignored artifact) during a bare `cargo clippy`/`cargo test`, so stage the
      # service binary first — exactly what `tauri build`'s beforeBuildCommand does.
      - name: Stage service binary
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eir-ui/build-svc.ps1

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      # windows-latest ships neither WebDriver tool the e2e suite below needs,
      # and scripts/run-e2e.ps1 deliberately never downloads either one on its
      # own (right for a developer machine, useless on a bare runner) — so CI
      # provisions them itself: a pinned, hash-verified tauri-driver (mirrors
      # the ComputeQuiet/SwatPulse reference harnesses) and a WebView2-matched,
      # Microsoft-signature-verified msedgedriver.
      - name: Install tauri-driver
        shell: bash
        run: |
          bash scripts/setup-tauri-driver.sh
          cygpath -w "$PWD/.webdriver" >> "$GITHUB_PATH"

      - name: Provision msedgedriver for e2e
        shell: pwsh
        run: ./scripts/setup-msedgedriver-ci.ps1

      # Drives the real debug eir.exe + eir-svc.exe through tauri-driver and the
      # real webview, fully isolated from the installed Eir — see e2e/service.ts.
      # windows-ci.ps1 applies the WebView2 remote-debugging policy override
      # GitHub's elevated runners need (see its header comment) and removes it
      # afterwards regardless of outcome.
      - name: End-to-end suite
        shell: pwsh
        run: ./e2e/windows-ci.ps1

      # The full bundle build runs beforeBuildCommand (stages eir-svc.exe) and signs
      # the updater artefacts, so a broken bundle can't ship green. Build-only — no
      # tagName, so nothing is published.
      - name: Full Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: eir-ui
          args: -- --locked

      - name: Check portable dependency imports
        shell: pwsh
        run: ./scripts/check-portable-imports.ps1 -EirExe target/release/eir.exe -ServiceExe target/release/eir-svc.exe

      - name: Smoke installed LocalSystem service
        shell: pwsh
        run: ./scripts/service-smoke.ps1 -ServiceBinary target/release/eir-svc.exe

      - name: Smoke standalone executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/eir.exe).Path
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Standalone Eir exited with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Build and smoke self-contained portable executable
        shell: pwsh
        run: ./scripts/portable-smoke.ps1 -EirExe target/release/eir.exe -ServiceExe target/release/eir-svc.exe -Output target/release/Eir_ci_windows-x64.exe

  # Headless Linux build of eir-svc + eirctl (eir-cli). Deliberately -p scoped, never
  # --workspace and never -p eir-ui: eir-ui (the Tauri tray) is Windows-only and its
  # Linux bundling needs GTK/webkit2gtk packages this repo does not install here. The
  # existing `verify` (Windows) and `dependency-audit` jobs above are untouched.
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p eir-proto -p eir-svc -p eirctl --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p eir-proto -p eir-svc -p eirctl --all-targets
