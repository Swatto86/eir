name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --target x86_64-pc-windows-msvc

  release:
    needs: dependency-audit
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2

      - name: Cache fixed WebView2 runtime
        uses: actions/cache@v5
        with:
          path: target/webview2
          key: webview2-fixed-150.0.4078.105-x64

      - name: Verify checkout and release version
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw "Checkout $head does not match release SHA $env:GITHUB_SHA"
          }
          ./scripts/check-versions.ps1 -ExpectedTag $env:GITHUB_REF_NAME

      - name: Check packaging gates
        shell: pwsh
        run: |
          ./scripts/test-installer-hooks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-release-gates.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-portable-runner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage service binary
        shell: pwsh
        run: ./eir-ui/build-svc.ps1

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      # Build and sign only. GitHub draft creation/upload lives in publish-release.ps1
      # so a 503 replacing an existing draft asset cannot abort after the Windows build.
      - name: Build installer and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: eir-ui
          args: -- --locked

      - name: Check portable dependency imports
        shell: pwsh
        run: ./scripts/check-portable-imports.ps1 -EirExe target/release/eir.exe -ServiceExe target/release/eir-svc.exe

      - name: Smoke installed LocalSystem service
        shell: pwsh
        run: ./scripts/service-smoke.ps1 -ServiceBinary target/release/eir-svc.exe

      - name: Smoke standalone executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/eir.exe).Path
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Standalone Eir exited with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Build and smoke self-contained portable executable
        shell: pwsh
        run: ./scripts/portable-smoke.ps1 -EirExe target/release/eir.exe -ServiceExe target/release/eir-svc.exe -Output "target/release/Eir_${env:GITHUB_REF_NAME}_windows-x64.exe"

      - name: Upload, verify, and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-release.ps1
