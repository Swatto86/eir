[package]
name = "eir-ui"
version = "0.32.0"
edition = "2021"
authors = ["Swatto <claude.ai@swatto.co.uk>"]
description = "Eir system monitor — tray UI"
license = "MIT"

[[bin]]
name = "eir"
path = "src/main.rs"

[dependencies]
eir-proto = { path = "../eir-proto" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Native file/folder picker for Ask Eir attachments.
tauri-plugin-dialog = "2"
base64 = "0.22"
# Fullscreen-game detection for Game Mode: SHQueryUserNotificationState (shell32).
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation"] }
# Query/install the Windows service from the About view.
windows-service = "0.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }
